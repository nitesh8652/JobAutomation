<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobbot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b58'/%3E%3Cpath d='M10 21V11h3v10zm4.5 0V11h3.2l4.3 6.2V11H25v10h-3.1l-4.4-6.3V21z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">j</span>
      <div>
        <strong>jobbot</strong>
        <small>apply safely</small>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/dashboard" data-view="dashboard" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#/jobs" data-view="jobs" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h4a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v2H3V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2zm0 2v1h4V6zM3 13h7v2h4v-2h7v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Jobs</span>
        <em class="nav-count" data-count="jobs"></em>
      </a>
      <a href="#/review" data-view="review" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 21h22zm0 6 7.5 11h-15zM11 10h2v5h-2zm0 6h2v2h-2z"/></svg>
        <span>Needs review</span>
        <em class="nav-count warn" data-count="review"></em>
      </a>
      <a href="#/assist" data-view="assist" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v3H4zm0 5h16v11H4zm2 2v7h12v-7zm2 2h8v2H8z"/></svg>
        <span>Apply by hand</span>
        <em class="nav-count info" data-count="assist"></em>
      </a>
      <a href="#/skill-gaps" data-view="skill-gaps" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
        <span>Skill Gaps</span>
      </a>
      <a href="#/applied" data-view="applied" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12 3.4 13.4 9 19l12-12-1.4-1.4z"/></svg>
        <span>Applied</span>
      </a>
      <a href="#/activity" data-view="activity" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-7 4 14 2-7h6v2h-4.4l-3 10h-2l-4-13-1.2 5H3z"/></svg>
        <span>Activity</span>
        <em class="nav-count" data-count="running"></em>
      </a>
      <a href="#/settings" data-view="settings" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4a7 7 0 0 1-.1 1.2l2 1.6-2 3.4-2.4-1a7 7 0 0 1-2 1.2l-.4 2.6h-4l-.4-2.6a7 7 0 0 1-2-1.2l-2.4 1-2-3.4 2-1.6A7 7 0 0 1 3 12c0-.4 0-.8.1-1.2l-2-1.6 2-3.4 2.4 1a7 7 0 0 1 2-1.2L7.9 3h4l.4 2.6a7 7 0 0 1 2 1.2l2.4-1 2 3.4-2 1.6c.1.4.1.8.1 1.2z"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="mini-quota" id="mini-quota"></div>
      <div class="conn" id="conn"><i></i><span>connecting</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title-block">
        <h1 id="view-title">Dashboard</h1>
        <p id="view-sub">Your job search at a glance</p>
      </div>
      <div class="top-actions">
        <div class="taskbar" id="taskbar">
          <span class="spinner" aria-hidden="true"></span>
          <span id="taskbar-text">Working</span>
          <button class="link-btn" id="taskbar-view" type="button">View</button>
          <button class="link-btn danger" id="taskbar-stop" type="button">Stop</button>
        </div>
        <button class="btn ghost" id="btn-quick-apply" type="button" disabled>Apply</button>
        <button class="btn" id="btn-quick-fetch" type="button" title="Search all enabled feeds and configured ATS boards">Fetch jobs</button>
        <button class="icon-btn" id="btn-refresh" type="button" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.3L13 11h8V3z"/></svg>
        </button>
      </div>
    </header>

    <div id="banner"></div>
    <section id="view" class="view" aria-live="polite"></section>
  </main>
</div>

<div class="drawer-wrap" id="drawer" hidden>
  <div class="drawer-backdrop" data-close-drawer></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Job details">
    <div id="drawer-body"></div>
  </aside>
</div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title">Add a job</h2>
      <button class="icon-btn" type="button" data-close-modal aria-label="Close">&times;</button>
    </header>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
