[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Policy-safe job application automation (public ATS APIs + hosted forms)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "openai>=1.40",
  "playwright>=1.45",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36",
  "pymysql>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobbot = "jobbot.cli:main"
jobbot-v2 = "jobbot.v2.cli:main"
jobbot-api = "jobbot.v2.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobbot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
